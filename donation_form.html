<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organ Donation and Requirement Form</title>
    <link rel="stylesheet" href="./styles/donationFormStyles.css">
</head>
<body>
    <header>
        <nav>
            <a href="./total_project.html">Home</a>
            <a href="./list_of_organs.html">Organs</a>
            <a href="./hospitals.html">Hospitals</a>
            <a href="./service.html">Service</a>
            <a href="./contact_us.html">Contact us</a>
        </nav>
    </header>

    <h1>Organ Donation form</h1>
    <form action="./successprompt.html">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" required></textarea>

        <label for="blood-group">Blood Group:</label>
        <select id="blood-group" name="blood-group" required>
            <option value="" disabled selected>Select your blood group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
        
        <label for="organs-donate">Organs to Donate:</label>
        <select id="organs-donate" name="organs-donate[]" multiple required>
            <option value="Kidney">Kidney</option>
            <option value="Liver">Liver</option>
            <option value="Heart">Heart</option>
            <option value="Lungs">Lungs</option>
            <option value="Pancreas">Pancreas</option>
            <option value="Corneas">Corneas</option>
            <option value="Skin">Skin</option>
        </select>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
